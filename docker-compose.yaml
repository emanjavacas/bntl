  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - ${MONGODB_PORT:-27017}:${MONGODB_PORT:-27017} # for debugging
    command: mongod --port ${MONGODB_PORT:-27017}
    volumes:
      - "./app-data/${ENV}/mongo-data:/data/db"

  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    ports:
      - ${QDRANT_HTTP_PORT:-6333}:${QDRANT_HTTP_PORT:-6333} # for debugging
    environment:
      - QDRANT__SERVICE__HTTP_PORT=${QDRANT_HTTP_PORT:-6333}
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT:-6334}
    volumes:
      - "./app-data/${ENV}/qdrant-data:/qdrant/storage"

  redis:
    image: redis:7.4.2-alpine3.21
    restart: unless-stopped
    environment:
      - REDIS_PORT=${REDIS_PORT:-6379}
    ports:
      - ${REDIS_PORT:-6379}:${REDIS_PORT:-6379}
    command: redis-server --port ${REDIS_PORT:-6379}
    volumes:
      - "./app-data/${ENV}/redis-data:/data"
