  #             count: all
  #             capabilities: [gpu]
  #   depends_on:
  #     - mongodb
  #     - qdrant
  #   volumes:
  #     - .:/app

  mongodb:
    image: mongo:7
    ports:
      - ${MONGODB_PORT}:${MONGODB_PORT} # for debugging
    command: mongod --port ${MONGODB_PORT}
    
    # volumes:
    #   - ./mongo-data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - ${QDRANT_HTTP_PORT}:${QDRANT_HTTP_PORT} # for debugging
    environment:
      - QDRANT__SERVICE__HTTP_PORT=${QDRANT_HTTP_PORT}
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT}
