
services:
  server:
    build: .
    ports:
      - ${PORT}:${PORT} # bind port to make it accessible from the outside world
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "${PORT}"]
    depends_on:
      - mongodb
      - qdrant
    volumes:
      - .:/app
    
  # vectorizer:
  #   build: .
  #   command: ["uvicorn", "vectorizer.server:app", "--host", "0.0.0.0", "--port", "${VECTORIZER_PORT}", "--workers", "${VECTORIZER_WORKERS}"]
  #   deploy:
